dependencies {
    implementation project(':conductor-common')
    implementation project(':conductor-core')
    compileOnly 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'

    implementation "javax.ws.rs:jsr311-api:${revJsr311Api}"
    // Use Spring Boot managed versions for HttpComponents Client 5
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.apache.httpcomponents.core5:httpcore5'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2'

    // Add runtime dependencies for Spring Boot 3.5.11 RestTemplate compatibility
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation "org.testcontainers:mockserver:${revTestContainer}"
    testImplementation "org.mock-server:mockserver-client-java:${revMockServerClient}"
    testImplementation "org.bouncycastle:bcprov-jdk15on:1.70"
    testImplementation "org.bouncycastle:bcpkix-jdk15on:1.70"
}